server:
  port: 8080

spring:
  thymeleaf:
    cache: false

anthropic:
  api-key: ${ANTHROPIC_API_KEY:changeme}
  model: claude-haiku-4-5-20251001
  max-tokens: 4096
  base-url: https://api.anthropic.com/v1

codegen:
  session:
    ttl-minutes: 30
    max-concurrent: 10
  spec:
    max-endpoints: 10
    max-size-kb: 128
