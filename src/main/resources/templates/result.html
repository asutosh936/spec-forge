<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SpecForge — Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6" th:attr="data-language=${language}">

<div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold">SpecForge — Project Generated</h1>
            <p class="text-gray-400 text-sm mt-1">
                <span th:text="${language}">java</span>
                &nbsp;·&nbsp;
                <span th:text="${files.size()}">0</span> files
            </p>
        </div>
        <div class="flex gap-3">
            <a th:href="@{/download/{id}(id=${result.sessionId()})}"
               class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg transition-colors text-sm">
                Download ZIP
            </a>
            <a href="/"
               class="px-5 py-2 bg-gray-700 hover:bg-gray-600 text-white font-semibold rounded-lg transition-colors text-sm">
                Start Over
            </a>
        </div>
    </div>

    <!-- Two-panel layout -->
    <div class="grid grid-cols-4 gap-4" style="height: 70vh;">

        <!-- File tree (left) -->
        <div class="col-span-1 bg-gray-900 border border-gray-700 rounded-lg p-3 overflow-y-auto">
            <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Files</p>
            <div id="file-tree" class="space-y-0.5 font-mono text-xs">
                <div th:each="file, stat : ${files}"
                     class="file-tree-item px-2 py-1 rounded cursor-pointer hover:bg-gray-800 truncate"
                     th:attr="data-content=${file.content}, data-path=${file.filename}"
                     th:classappend="${stat.first} ? ' active'"
                     th:text="${file.filename}">
                </div>
            </div>
        </div>

        <!-- CodeMirror editor (right) -->
        <div class="col-span-3 flex flex-col">
            <p id="active-path" class="text-xs text-gray-500 mb-2 font-mono"
               th:text="${firstFile != null} ? ${firstFile.filename} : ''"></p>
            <!-- Initial content injected server-side; editor replaces this on load -->
            <pre id="initial-content" class="hidden"
                 th:text="${firstFile != null} ? ${firstFile.content} : ''"></pre>
            <div id="editor-mount" class="flex-1 rounded-lg overflow-hidden border border-gray-700"></div>
        </div>
    </div>
</div>

<script type="module" src="/js/preview.js"></script>
</body>
</html>
