<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SpecForge — Generating</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { display:['Space Grotesk','sans-serif'], mono:['JetBrains Mono','monospace'] },
  colors: { ink:'#08080c', surface:'#0e0e16', surface2:'#13131f', line:'rgba(255,255,255,0.08)' },
}}};
</script>
<style>
  body { font-family:'Space Grotesk',sans-serif; }
  .glow-bg::before { content:''; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(680px 420px at 50% -10%, rgba(99,102,241,0.20), transparent 70%); }
  .node-line { background: linear-gradient(180deg, rgba(99,102,241,.6), rgba(99,102,241,.1)); }
  .step { transition: all .4s cubic-bezier(.4,0,.2,1); }
  .step.pending { opacity:.45; }
  .step.active  { opacity:1; }
  .step.done    { opacity:1; }
  .dot-active { box-shadow: 0 0 0 0 rgba(99,102,241,.6); animation: ring 1.6s infinite; }
  @keyframes ring { 0%{box-shadow:0 0 0 0 rgba(99,102,241,.5)} 70%{box-shadow:0 0 0 12px rgba(99,102,241,0)} 100%{box-shadow:0 0 0 0 rgba(99,102,241,0)} }
  .log-line { animation: ll .35s ease both; }
  @keyframes ll { from{opacity:0; transform:translateX(-6px)} to{opacity:1; transform:none} }
  .fade-in { animation: fi .5s ease both; }
  @keyframes fi { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .bar-fill { transition: width .6s cubic-bezier(.4,0,.2,1); }
</style>
</head>
<body class="bg-ink text-gray-100 min-h-screen glow-bg">

<div class="relative z-10 min-h-screen flex items-center justify-center p-8">
  <div class="w-full max-w-3xl fade-in">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="grid place-items-center w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2 5 13h6l-1 9 9-11h-6l1-9z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-none">Forging your project</h1>
          <p class="text-gray-500 text-sm mt-1">Claude is writing your codebase…</p>
        </div>
      </div>
      <div class="text-right">
        <div class="font-mono text-2xl font-semibold text-indigo-300">
          <span id="pct">0</span><span class="text-sm text-gray-500">%</span>
        </div>
        <div class="text-xs text-gray-600 font-mono">~<span id="eta">60</span>s remaining</div>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="h-1.5 rounded-full bg-surface2 overflow-hidden mb-8">
      <div id="bar" class="bar-fill h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500" style="width:0%"></div>
    </div>

    <div class="grid grid-cols-5 gap-5">
      <!-- Stepper -->
      <div id="steps" class="col-span-2 space-y-1"></div>

      <!-- Live log -->
      <div class="col-span-3 bg-surface border border-line rounded-xl overflow-hidden flex flex-col" style="height:340px">
        <div class="flex items-center gap-2 px-4 py-2.5 border-b border-line bg-black/20">
          <span class="w-2.5 h-2.5 rounded-full bg-red-500/70"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-yellow-500/70"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-green-500/70"></span>
          <span class="ml-2 text-xs font-mono text-gray-500">pipeline.log</span>
          <span id="liveTag" class="ml-auto flex items-center gap-1.5 text-xs font-mono text-emerald-400">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>live
          </span>
        </div>
        <div id="log" class="flex-1 overflow-y-auto px-4 py-3 font-mono text-xs leading-relaxed text-gray-400 space-y-1"></div>
      </div>
    </div>

    <!-- Error overlay (hidden until a failure) -->
    <div id="errorBox" style="display:none"
         class="mt-6 flex items-start gap-3 bg-red-950/60 border border-red-800/60 rounded-xl p-4 text-red-200 text-sm">
      <svg width="18" height="18" class="mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <div>
        <p class="font-semibold">Generation failed</p>
        <p id="errorMsg" class="mt-1"></p>
        <a href="/" class="mt-2 inline-block text-indigo-400 hover:underline">← Try again</a>
      </div>
    </div>

    <p class="text-center text-xs text-gray-600 mt-6 font-mono">Redirecting to your project when complete…</p>
  </div>
</div>

<script th:inline="javascript">
  const sessionId = [[${sessionId}]];
</script>
<script>
const stepData = [
  { label:'Parse OpenAPI spec',      detail:'validating structure & endpoints' },
  { label:'Plan project structure',  detail:'controllers · services · DTOs' },
  { label:'Generate source files',   detail:'calling Claude API (single call)' },
  { label:'Parse & assemble output', detail:'extracting generated files' },
  { label:'Packaging',               detail:'building ZIP archive' },
];
const logScripts = [
  ['→ reading spec…', '✓ detected OpenAPI 3.0', '✓ endpoints & schemas extracted'],
  ['→ mapping resources…', '✓ layered architecture planned', '✓ file list built'],
  ['→ sending to Claude…', '→ waiting for response…', '✓ code received'],
  ['→ parsing JSON response…', '✓ files extracted & validated'],
  ['→ assembling ZIP…', '✓ project ready'],
];

const stepsEl = document.getElementById('steps');
const logEl   = document.getElementById('log');
const bar     = document.getElementById('bar');
const pct     = document.getElementById('pct');
const eta     = document.getElementById('eta');

// Build stepper
stepData.forEach((s, i) => {
  const row = document.createElement('div');
  row.className = 'step pending relative flex gap-3 pb-4';
  row.dataset.i = i;
  row.innerHTML = `
    <div class="relative flex flex-col items-center">
      <div class="dot grid place-items-center w-7 h-7 rounded-full border border-line bg-surface2 text-gray-500 shrink-0">
        <span class="num text-xs font-mono">${i+1}</span>
        <svg class="check hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      ${i < stepData.length-1 ? '<div class="conn w-px flex-1 mt-1 bg-line"></div>' : ''}
    </div>
    <div class="pt-0.5">
      <p class="label text-sm font-medium text-gray-300">${s.label}</p>
      <p class="detail text-xs text-gray-600 mt-0.5 font-mono">${s.detail}</p>
    </div>`;
  stepsEl.appendChild(row);
});

function addLog(text) {
  const ok  = text.startsWith('✓');
  const div = document.createElement('div');
  div.className = 'log-line ' + (ok ? 'text-emerald-400' : 'text-gray-400');
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function animatePct(target) {
  const start = parseInt(pct.textContent), t0 = performance.now(), dur = 600;
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    pct.textContent = Math.round(start + (target - start) * p);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let animDone = false;
function runStep(i) {
  const rows = stepsEl.querySelectorAll('.step');
  if (i >= stepData.length) { animDone = true; checkAndRedirect(); return; }
  const row = rows[i];
  row.classList.remove('pending'); row.classList.add('active');
  const dot = row.querySelector('.dot');
  dot.classList.add('dot-active', 'border-indigo-500', 'text-indigo-300');
  dot.classList.remove('bg-surface2'); dot.classList.add('bg-indigo-500/20');
  row.querySelector('.label').classList.replace('text-gray-300', 'text-white');

  const lines = logScripts[i]; let li = 0;
  const t = setInterval(() => { if (li < lines.length) addLog(lines[li++]); else clearInterval(t); }, 380);

  const target = Math.round(((i + 1) / stepData.length) * 100);
  bar.style.width = target + '%';
  animatePct(target);
  eta.textContent = Math.max(0, Math.round((stepData.length - 1 - i) * 14));

  setTimeout(() => {
    dot.classList.remove('dot-active', 'bg-indigo-500/20', 'border-indigo-500', 'text-indigo-300');
    dot.classList.add('bg-gradient-to-br', 'from-indigo-500', 'to-violet-600', 'border-transparent');
    dot.querySelector('.num').classList.add('hidden');
    dot.querySelector('.check').classList.remove('hidden');
    row.classList.replace('active', 'done');
    const conn = row.querySelector('.conn'); if (conn) conn.classList.replace('bg-line', 'node-line');
    runStep(i + 1);
  }, 1800);
}

// Poll backend every 3 seconds — redirect when truly done
let redirected = false;
function poll() {
  if (redirected) return;
  fetch('/api/status/' + sessionId)
    .then(r => r.json())
    .then(data => {
      if (data.status === 'done') {
        redirected = true;
        document.getElementById('liveTag').innerHTML = '<span class="text-emerald-400">✓ complete</span>';
        addLog('✓ done — opening project…');
        eta.textContent = '0';
        setTimeout(() => { window.location.href = '/result/' + sessionId; }, 600);
      } else if (data.status === 'failed') {
        document.getElementById('errorMsg').textContent = data.error || 'Unknown error';
        document.getElementById('errorBox').style.display = 'flex';
        document.getElementById('liveTag').innerHTML = '<span class="text-red-400">✗ failed</span>';
      } else {
        setTimeout(poll, 3000);
      }
    })
    .catch(() => setTimeout(poll, 3000));
}

// When animation finishes before backend responds, keep polling
function checkAndRedirect() {
  if (!redirected) { addLog('→ finalising…'); setTimeout(poll, 0); }
}

setTimeout(() => runStep(0), 500);
setTimeout(poll, 3000);
</script>
</body>
</html>
