<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SpecForge</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        display: ['Space Grotesk', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
      },
      colors: {
        ink: '#08080c', surface: '#0e0e16', surface2: '#13131f',
        line: 'rgba(255,255,255,0.08)',
      },
    },
  },
};
</script>
<style>
  body { font-family: 'Space Grotesk', system-ui, sans-serif; }
  .glow-bg::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(680px 420px at 50% -8%, rgba(99,102,241,0.22), transparent 70%),
      radial-gradient(540px 360px at 88% 8%, rgba(139,92,246,0.12), transparent 70%);
  }
  .field { transition: border-color .18s, box-shadow .18s, background-color .18s; }
  .field:focus-within {
    border-color: rgba(99,102,241,0.55);
    box-shadow: 0 0 0 4px rgba(99,102,241,0.14), 0 0 40px -8px rgba(99,102,241,0.35);
    background-color: #11111c;
  }
  textarea { resize: none; }
  textarea::placeholder { color: #4b4b5c; }
  .seg { transition: color .18s; }
  .seg-pill { transition: transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1); }
  .gen-btn { position: relative; overflow: hidden; }
  .gen-btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
    transform: translateX(-120%);
  }
  .gen-btn:hover::after { transform: translateX(120%); transition: transform .85s ease; }
  .chip { transition: all .15s; }
  .chip:hover { border-color: rgba(99,102,241,0.5); color: #c7d2fe; }
  .count-pulse { animation: cp .3s ease; }
  @keyframes cp { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
  .ln { color:#3a3a48; text-align:right; user-select:none; }
  .fade-in { animation: fi .5s ease both; }
  @keyframes fi { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .drop-active { border-color: rgba(99,102,241,0.7) !important; background:#10101b !important; }
</style>
</head>
<body class="bg-ink text-gray-100 min-h-screen glow-bg">

<div class="relative z-10 min-h-screen flex items-center justify-center p-8">
  <div class="w-full max-w-2xl fade-in">

    <!-- Brand -->
    <div class="flex items-center gap-3 mb-7">
      <div class="grid place-items-center w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 shadow-lg shadow-indigo-900/40">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2 5 13h6l-1 9 9-11h-6l1-9z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight leading-none">SpecForge</h1>
        <p class="text-gray-500 text-sm mt-1">Paste an OpenAPI spec, pick a language, get a working codebase.</p>
      </div>
    </div>

    <!-- Server-side error -->
    <div th:if="${error}"
         class="mb-5 flex items-start gap-3 bg-red-950/60 border border-red-800/60 rounded-xl p-4 text-red-200 text-sm">
      <svg width="18" height="18" class="mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <span th:text="${error}">Something went wrong.</span>
    </div>

    <form method="post" action="/generate">
      <!-- Spec field -->
      <div class="mb-5">
        <div class="flex items-center justify-between mb-2">
          <label for="spec" class="text-sm font-medium text-gray-200">OpenAPI / Swagger Spec</label>
          <button type="button" id="loadExample"
                  class="chip text-xs font-mono px-2.5 py-1 rounded-md border border-line text-gray-400 bg-surface2/60">
            ↧ Load example
          </button>
        </div>

        <div id="specField" class="field bg-surface border border-line rounded-xl overflow-hidden">
          <div class="flex">
            <div id="gutter" class="ln font-mono text-xs py-3 px-3 bg-black/20 border-r border-line leading-6 select-none">1</div>
            <textarea id="spec" name="spec" rows="13" spellcheck="false"
              placeholder="Paste your YAML or JSON spec here…"
              th:text="${request?.spec}"
              class="flex-1 bg-transparent px-3.5 py-3 font-mono text-sm leading-6 text-gray-100 focus:outline-none"
              required></textarea>
          </div>
          <!-- status bar -->
          <div class="flex items-center justify-between px-3.5 py-2 border-t border-line bg-black/20 text-xs">
            <div class="flex items-center gap-4 font-mono text-gray-500">
              <span><span id="lineCount" class="text-gray-300 inline-block">0</span> lines</span>
              <span class="flex items-center gap-1.5">
                <span id="epDot" class="w-1.5 h-1.5 rounded-full bg-gray-600"></span>
                <span id="epCount" class="text-gray-300 inline-block">0</span>/10 endpoints
              </span>
            </div>
            <span id="fmt" class="font-mono text-gray-600">—</span>
          </div>
        </div>
        <p class="text-xs text-gray-600 mt-1.5">
          Drop a <code class="font-mono">.yaml</code> / <code class="font-mono">.json</code> file, or paste above. Max 10 endpoints.
        </p>
      </div>

      <!-- Language segmented control (hidden input carries the value) -->
      <div class="mb-5">
        <label class="block text-sm font-medium mb-2 text-gray-200">Target Language</label>
        <div id="seg" class="relative inline-flex p-1 rounded-xl bg-surface border border-line">
          <span id="segPill"
                class="seg-pill absolute top-1 bottom-1 left-1 rounded-lg bg-gradient-to-br from-indigo-500/90 to-violet-600/90 shadow shadow-indigo-900/40"
                style="width:152px"></span>
          <button type="button" data-val="JAVA"
                  class="seg relative z-10 flex items-center gap-2 px-4 py-2 text-sm font-medium text-white"
                  style="width:152px; justify-content:center">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 18.3c-1 .6.1 1.2 1.4 1.5 3.8.9 9.6-.4 8-1.6m-9-1.4c-1.4.4-2.4 1.6 1 1.9 2.4.2 5.2-.5 6.6-1.3m-3.6-4c-1.9.2-5 .4-3 1.5 1.8.7 5.7.5 7.1-.3m1.4-3.3c-3 .7-7.4 1.5-3 2 2.7.2 7.7-.6 6.6-1.4"/><path d="M12 2s2.5 2.6-2.4 6.5C7 11 9.7 13 12 14.7c-5.2-2-2.8-4.6 0-7 .6-.6 1.2-1.5 0-5.7z"/></svg>
            Java
          </button>
          <button type="button" data-val="PYTHON"
                  class="seg relative z-10 flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-400"
                  style="width:152px; justify-content:center">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M11.9 2c-2 0-3.6.6-3.6 2.6v1.7h4v.5H6.3c-2 0-3.3 1.2-3.3 3.6 0 2.3 1.2 3.6 3.3 3.6h1.2v-2c0-2 1.7-3.6 3.7-3.6h3.6c1.6 0 2.9-1.3 2.9-2.9V4.6C17.7 2.9 16 2 13.9 2h-2zm-1.8 1.6a.7.7 0 110 1.4.7.7 0 010-1.4z"/><path d="M12.1 22c2 0 3.6-.6 3.6-2.6v-1.7h-4v-.5h5.9c2 0 3.3-1.2 3.3-3.6 0-2.3-1.2-3.6-3.3-3.6h-1.2v2c0-2-1.7-3.6-3.7-3.6H8.4c-1.6 0-2.9 1.3-2.9 2.9v2.6C5.5 21 7.2 22 9.3 22h2.8zm1.8-1.6a.7.7 0 110-1.4.7.7 0 010 1.4z"/></svg>
            Python
          </button>
        </div>
        <input type="hidden" name="language" id="languageInput" value="JAVA"/>
        <p class="text-xs text-gray-600 mt-1.5">
          <span id="langSub">Spring Boot</span> · Maven project, REST controllers, DTOs &amp; services.
        </p>
      </div>

      <!-- Additional context (collapsible) -->
      <div class="mb-6">
        <button type="button" id="ctxToggle"
                class="flex items-center gap-2 text-sm font-medium text-gray-300 hover:text-white transition-colors">
          <svg id="ctxChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               class="transition-transform"><path d="m9 18 6-6-6-6"/></svg>
          Additional Context <span class="text-gray-600 font-normal">(optional)</span>
        </button>
        <div id="ctxWrap" class="grid grid-rows-[0fr] transition-all duration-300 ease-out">
          <div class="overflow-hidden">
            <div class="field bg-surface border border-line rounded-xl mt-2.5">
              <textarea id="additionalContext" name="additionalContext" rows="3"
                placeholder="e.g. use PostgreSQL, add pagination, include Swagger UI…"
                th:text="${request?.additionalContext}"
                class="w-full bg-transparent px-3.5 py-3 text-sm text-gray-100 focus:outline-none resize-none"></textarea>
              <div class="flex flex-wrap gap-2 px-3.5 pb-3">
                <button type="button" class="ctx-chip chip text-xs font-mono px-2.5 py-1 rounded-md border border-line text-gray-400">+ PostgreSQL</button>
                <button type="button" class="ctx-chip chip text-xs font-mono px-2.5 py-1 rounded-md border border-line text-gray-400">+ Swagger UI</button>
                <button type="button" class="ctx-chip chip text-xs font-mono px-2.5 py-1 rounded-md border border-line text-gray-400">+ Pagination</button>
                <button type="button" class="ctx-chip chip text-xs font-mono px-2.5 py-1 rounded-md border border-line text-gray-400">+ Docker</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Generate button -->
      <button type="submit" id="genBtn"
        class="gen-btn w-full flex items-center justify-center gap-2 bg-gradient-to-br from-indigo-500 to-violet-600 hover:from-indigo-400 hover:to-violet-500 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-900/40 disabled:opacity-60 disabled:cursor-not-allowed">
        <span id="genLabel">Generate Project</span>
        <svg id="genArrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        <svg id="genSpin" class="animate-spin h-5 w-5 hidden" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
      </button>
    </form>
  </div>
</div>

<script>
const sampleSpec = `openapi: "3.0.0"
info:
  title: Pet Store API
  version: "1.0.0"
  description: A simple pet store API
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: A list of pets
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A pet
components:
  schemas:
    Pet:
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]
    NewPet:
      properties:
        name:
          type: string
      required: [name]`;

const spec = document.getElementById('spec');
const gutter = document.getElementById('gutter');
const lineCount = document.getElementById('lineCount');
const epCount = document.getElementById('epCount');
const epDot = document.getElementById('epDot');
const fmt = document.getElementById('fmt');

function refresh() {
  const text = spec.value;
  const lines = text.length ? text.split('\n').length : 0;
  gutter.innerHTML = Array.from({length: Math.max(lines,1)}, (_,i)=>i+1).join('<br>');
  pulse(lineCount, lines);
  const verbs = (text.match(/^\s+(get|post|put|delete|patch):/gim) || []).length;
  const ops   = (text.match(/operationId:/gi) || []).length;
  const ep    = Math.max(verbs, ops);
  pulse(epCount, ep);
  const over = ep > 10;
  epDot.className = 'w-1.5 h-1.5 rounded-full ' + (ep===0 ? 'bg-gray-600' : over ? 'bg-red-500' : 'bg-emerald-500');
  epCount.className = (over ? 'text-red-400' : 'text-gray-300') + ' inline-block';
  if (!text.trim()) fmt.textContent = '—';
  else if (/^\s*[{[]/.test(text)) fmt.textContent = 'JSON ✓';
  else if (/:\s/.test(text)) fmt.textContent = 'YAML ✓';
  else fmt.textContent = 'plain';
}
function pulse(el, val) {
  if (el.textContent !== String(val)) {
    el.textContent = val;
    el.classList.remove('count-pulse');
    void el.offsetWidth;
    el.classList.add('count-pulse');
  }
}
spec.addEventListener('input', refresh);
spec.addEventListener('scroll', () => { gutter.style.transform = `translateY(${-spec.scrollTop}px)`; });

document.getElementById('loadExample').addEventListener('click', () => {
  spec.value = sampleSpec; refresh(); spec.focus();
});

// Drag & drop
const field = document.getElementById('specField');
['dragenter','dragover'].forEach(e => field.addEventListener(e, ev => { ev.preventDefault(); field.classList.add('drop-active'); }));
['dragleave','drop'].forEach(e => field.addEventListener(e, ev => { ev.preventDefault(); field.classList.remove('drop-active'); }));
field.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f) { f.text().then(t => { spec.value = t; refresh(); }); }
});

// Segmented language control
const segEl    = document.getElementById('seg');
const pill     = document.getElementById('segPill');
const langInput = document.getElementById('languageInput');
const langSub  = document.getElementById('langSub');
segEl.querySelectorAll('.seg').forEach((btn, i) => {
  btn.addEventListener('click', () => {
    segEl.querySelectorAll('.seg').forEach(b => b.classList.replace('text-white','text-gray-400'));
    btn.classList.replace('text-gray-400','text-white');
    pill.style.transform = `translateX(${i * 152}px)`;
    langInput.value = btn.dataset.val;
    langSub.textContent = btn.dataset.val === 'JAVA' ? 'Spring Boot' : 'FastAPI';
  });
});

// Collapsible context
const ctxToggle  = document.getElementById('ctxToggle');
const ctxWrap    = document.getElementById('ctxWrap');
const ctxChevron = document.getElementById('ctxChevron');
let ctxOpen = false;
ctxToggle.addEventListener('click', () => {
  ctxOpen = !ctxOpen;
  ctxWrap.style.gridTemplateRows = ctxOpen ? '1fr' : '0fr';
  ctxChevron.style.transform = ctxOpen ? 'rotate(90deg)' : 'none';
});
document.querySelectorAll('.ctx-chip').forEach(c => c.addEventListener('click', () => {
  const ta   = document.getElementById('additionalContext');
  const word = c.textContent.replace('+ ', '').trim();
  ta.value   = ta.value ? ta.value.replace(/\s*$/, '') + ', ' + word : word;
}));

// Submit — show spinner, disable button to prevent double-submit
document.querySelector('form').addEventListener('submit', () => {
  const b = document.getElementById('genBtn');
  b.disabled = true;
  document.getElementById('genLabel').textContent = 'Forging…';
  document.getElementById('genArrow').classList.add('hidden');
  document.getElementById('genSpin').classList.remove('hidden');
});

refresh();
</script>
</body>
</html>
